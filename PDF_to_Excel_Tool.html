<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>PDF → Excel Tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#f3f5f8;color:#222}
header{background:#1f4e79;color:#fff;padding:12px 20px;font-size:18px;font-weight:600}
.wrap{display:grid;grid-template-columns:420px 1fr;gap:14px;padding:14px;height:calc(100vh - 50px)}
.panel{background:#fff;border-radius:8px;box-shadow:0 1px 3px #0002;padding:12px;overflow:auto}
#drop{border:2px dashed #1f4e79;border-radius:8px;padding:18px;text-align:center;cursor:pointer;background:#f8fbff}
#drop.over{background:#e1efff}
.row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
label{font-size:13px}input[type=text],input[type=number]{padding:4px 6px;border:1px solid #bbb;border-radius:4px}
button{background:#1f4e79;color:#fff;border:0;border-radius:4px;padding:6px 12px;cursor:pointer}
button.sec{background:#e5e9ef;color:#222}button:disabled{opacity:.5}
.tbl{border:1px solid #ddd;border-radius:6px;padding:6px 8px;margin:6px 0;font-size:13px;cursor:pointer}
.tbl.active{border-color:#1f4e79;background:#eef5ff}
.tbl .meta{color:#666;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl input[type=text]{width:130px}
h3{margin:12px 0 6px;font-size:14px;color:#1f4e79}
#sheetList div{display:flex;align-items:center;gap:6px;font-size:13px;margin:3px 0}
table.prev{border-collapse:collapse;font-size:12px}
table.prev td{border:1px solid #ccc;padding:3px 6px;min-width:50px}
table.prev td[contenteditable]:focus{outline:2px solid #1f4e79}
table.prev tr.hdr td{background:#dce6f1;font-weight:600}
#status{font-size:13px;color:#555}
</style>
</head>
<body>
<header>PDF → Excel Tool (PDF có text, chạy hoàn toàn trên trình duyệt)</header>
<div class="wrap">
 <div class="panel">
  <div id="drop">Kéo thả file PDF vào đây hoặc bấm để chọn<input type="file" id="file" accept=".pdf" hidden></div>
  <div class="row">
   <label>Khoảng cách tách cột (pt) <input type="number" id="gap" value="8" min="2" max="50" style="width:60px"></label>
   <label>Số cột tối thiểu <input type="number" id="minCols" value="2" min="1" max="20" style="width:50px"></label>
   <button class="sec" id="redo" disabled>Nhận diện lại</button>
  </div>
  <div id="status">Chưa có file.</div>

  <h3>Bảng nhận diện được</h3>
  <div class="row">
   <button class="sec" id="allOn">Chọn tất cả</button><button class="sec" id="allOff">Bỏ chọn</button>
   <button class="sec" id="byPage">Mỗi trang 1 sheet</button>
  </div>
  <div id="tables"></div>

  <h3>Thứ tự sheet (bảng cùng tên sheet sẽ được nối lại)</h3>
  <div id="sheetList"></div>
  <div class="row">
   <label><input type="checkbox" id="dedupHdr" checked> Bỏ tiêu đề lặp khi nối bảng</label>
   <label><input type="checkbox" id="toNum" checked> Chuyển số</label>
  </div>
  <div class="row">
   <input type="text" id="outName" value="output.xlsx" style="flex:1">
   <button id="export" disabled>Xuất Excel</button>
  </div>
 </div>
 <div class="panel">
  <h3 id="prevTitle">Xem trước</h3>
  <div style="font-size:12px;color:#666;margin-bottom:6px">Bấm vào ô để sửa trực tiếp. Bấm tiêu đề cột để xóa cột.</div>
  <div id="preview"></div>
 </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $=id=>document.getElementById(id);
let pdfDoc=null, pageItems=[], tables=[], sheetOrder=[], activeIdx=-1, fileBase="output";

$('drop').onclick=()=>$('file').click();
$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('over')};
$('drop').ondragleave=()=>$('drop').classList.remove('over');
$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('over');if(e.dataTransfer.files[0])load(e.dataTransfer.files[0])};
$('file').onchange=e=>{if(e.target.files[0])load(e.target.files[0])};
$('redo').onclick=detect;

async function load(f){
 fileBase=f.name.replace(/\.pdf$/i,''); $('outName').value=fileBase+'.xlsx';
 $('status').textContent='Đang đọc '+f.name+' ...';
 pdfDoc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
 pageItems=[];
 for(let p=1;p<=pdfDoc.numPages;p++){
  const pg=await pdfDoc.getPage(p), tc=await pg.getTextContent();
  pageItems.push(tc.items.filter(i=>i.str.trim()).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width,h:Math.abs(i.transform[3])||8})));
  $('status').textContent=`Đang đọc trang ${p}/${pdfDoc.numPages}`;
 }
 if(!pageItems.some(a=>a.length)){$('status').textContent='PDF không có text (có thể là bản scan).';return}
 $('redo').disabled=false; detect();
}

function detect(){
 const gap=+$('gap').value||8, minCols=+$('minCols').value||2;
 tables=[];
 pageItems.forEach((items,pi)=>{
  // gom dòng theo y
  const sorted=[...items].sort((a,b)=>b.y-a.y||a.x-b.x), lines=[];
  for(const it of sorted){
   const L=lines.find(l=>Math.abs(l.y-it.y)<=Math.max(2,it.h*0.4));
   L?L.items.push(it):lines.push({y:it.y,items:[it]});
  }
  lines.forEach(l=>{
   l.items.sort((a,b)=>a.x-b.x); l.cells=[];
   for(const it of l.items){
    const c=l.cells[l.cells.length-1];
    if(c&&it.x-(c.x2)<gap){c.s+=(it.x-c.x2>1?' ':'')+it.s;c.x2=it.x+it.w}
    else l.cells.push({s:it.s,x:it.x,x2:it.x+it.w});
   }
  });
  // khối dòng liên tiếp có >= minCols ô
  let block=[];
  const flush=()=>{ if(block.length>=2) tables.push(makeTable(block,pi+1,gap)); block=[] };
  lines.forEach(l=>{ l.cells.length>=minCols?block.push(l):flush() }); flush();
 });
 tables.forEach((t,i)=>{t.id=`p${t.page}_t${tables.filter((u,j)=>j<i&&u.page===t.page).length+1}`;t.on=true;t.sheet='Sheet1'});
 $('status').textContent=`Tìm thấy ${tables.length} bảng trên ${pdfDoc.numPages} trang.`;
 refreshSheets(); renderList(); if(tables.length) show(0); else $('preview').innerHTML='';
}

function makeTable(block,page,gap){
 // cột = cụm theo vị trí x bắt đầu
 const xs=block.flatMap(l=>l.cells.map(c=>c.x)).sort((a,b)=>a-b), anchors=[];
 xs.forEach(x=>{ if(!anchors.length||x-anchors[anchors.length-1].max>gap*1.5) anchors.push({min:x,max:x}); else anchors[anchors.length-1].max=x });
 const rows=block.map(l=>{
  const r=Array(anchors.length).fill('');
  l.cells.forEach(c=>{
   let k=anchors.findIndex(a=>c.x>=a.min-1&&c.x<=a.max+1);
   if(k<0)k=anchors.reduce((b,a,i)=>Math.abs(a.min-c.x)<Math.abs(anchors[b].min-c.x)?i:b,0);
   r[k]=r[k]?r[k]+' '+c.s:c.s;
  });
  return r;
 });
 return {page,rows};
}

function renderList(){
 $('tables').innerHTML='';
 tables.forEach((t,i)=>{
  const d=document.createElement('div'); d.className='tbl'+(i===activeIdx?' active':'');
  d.innerHTML=`<div class="row" style="margin:0"><input type="checkbox" ${t.on?'checked':''}>
   <b>${t.id}</b><span style="color:#666">${t.rows.length-1} dòng × ${t.rows[0].length} cột</span>
   <span style="margin-left:auto">→ Sheet <input type="text" list="sheetNames" value="${esc(t.sheet)}"></span></div>
   <div class="meta">${esc(t.rows[0].join(' | '))}</div>`;
  const [cb,tx]=d.querySelectorAll('input');
  cb.onclick=e=>{e.stopPropagation();t.on=cb.checked;refreshSheets()};
  tx.onclick=e=>e.stopPropagation();
  tx.onchange=()=>{t.sheet=tx.value.trim().slice(0,31)||'Sheet1';refreshSheets()};
  d.onclick=()=>show(i);
  $('tables').appendChild(d);
 });
 let dl=$('sheetNames'); if(!dl){dl=document.createElement('datalist');dl.id='sheetNames';document.body.appendChild(dl)}
 dl.innerHTML=sheetOrder.map(s=>`<option value="${esc(s)}">`).join('');
 $('export').disabled=!tables.some(t=>t.on);
}

function refreshSheets(){
 const used=[...new Set(tables.filter(t=>t.on).map(t=>t.sheet))];
 sheetOrder=sheetOrder.filter(s=>used.includes(s)).concat(used.filter(s=>!sheetOrder.includes(s)));
 $('sheetList').innerHTML='';
 sheetOrder.forEach((s,i)=>{
  const n=tables.filter(t=>t.on&&t.sheet===s).map(t=>t.id).join(', ');
  const d=document.createElement('div');
  d.innerHTML=`<button class="sec" ${i?'':'disabled'}>▲</button><button class="sec" ${i<sheetOrder.length-1?'':'disabled'}>▼</button><b>${i+1}. ${esc(s)}</b><span style="color:#666">(${n})</span>`;
  const [up,dn]=d.querySelectorAll('button');
  up.onclick=()=>{[sheetOrder[i-1],sheetOrder[i]]=[sheetOrder[i],sheetOrder[i-1]];refreshSheets()};
  dn.onclick=()=>{[sheetOrder[i+1],sheetOrder[i]]=[sheetOrder[i],sheetOrder[i+1]];refreshSheets()};
  $('sheetList').appendChild(d);
 });
 renderList();
}

function show(i){
 activeIdx=i; const t=tables[i];
 $('prevTitle').textContent=`Xem trước: ${t.id} (trang ${t.page})`;
 let h='<table class="prev">';
 t.rows.forEach((r,ri)=>{h+=`<tr class="${ri?'':'hdr'}">`+r.map((c,ci)=>`<td contenteditable data-r="${ri}" data-c="${ci}">${esc(c)}</td>`).join('')+'</tr>'});
 $('preview').innerHTML=h+'</table>';
 $('preview').querySelectorAll('td').forEach(td=>{
  td.oninput=()=>{t.rows[td.dataset.r][td.dataset.c]=td.textContent};
  if(td.dataset.r==='0') td.ondblclick=()=>{ if(confirm('Xóa cột "'+td.textContent+'"?')){const c=+td.dataset.c;t.rows.forEach(r=>r.splice(c,1));show(i);renderList()} };
 });
 renderList();
}

$('allOn').onclick=()=>{tables.forEach(t=>t.on=true);refreshSheets()};
$('allOff').onclick=()=>{tables.forEach(t=>t.on=false);refreshSheets()};
$('byPage').onclick=()=>{tables.forEach(t=>t.sheet='Trang '+t.page);sheetOrder=[];refreshSheets()};

$('export').onclick=()=>{
 const wb=XLSX.utils.book_new();
 sheetOrder.forEach(s=>{
  const parts=tables.filter(t=>t.on&&t.sheet===s); let rows=[];
  parts.forEach((t,k)=>{
   let r=t.rows.map(x=>[...x]);
   if(k&&$('dedupHdr').checked&&r[0].join('|')===parts[0].rows[0].join('|')) r=r.slice(1);
   rows=rows.concat(r);
  });
  if($('toNum').checked) rows=rows.map((r,ri)=>ri?r.map(v=>{const n=v.replace(/,/g,'').trim();return n!==''&&!isNaN(n)?+n:v}):r);
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=(rows[0]||[]).map((_,c)=>({wch:Math.min(60,Math.max(...rows.map(r=>String(r[c]??'').length))+2)}));
  XLSX.utils.book_append_sheet(wb,ws,s.replace(/[\\\/\?\*\[\]:]/g,'_').slice(0,31));
 });
 let name=$('outName').value.trim()||'output.xlsx'; if(!/\.xlsx$/i.test(name))name+='.xlsx';
 XLSX.writeFile(wb,name);
};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
</script>
</body>
</html>
